<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى روان ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2; /* وردي فاتح */
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: #d81b60;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 40px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 15px 40px rgba(255, 182, 193, 0.4);
            border: 2px solid #ffc1cc;
        }

        /* حاوية الصورة مع الكلاسات التي طلبتها */
        .image-box {
            width: 180px;
            height: 180px;
            border-radius: 30px;
            margin: 0 auto 20px auto;
            background-size: cover;
            background-position: center;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: background-image 0.5s ease-in-out;
        }

        /* كلاسات الصور الستة التي طلبتها */
        /* ملاحظة: تأكد من وجود الصور بنفس هذه الأسماء في GitHub */
        .cit1 { background-image: url('cit1.jpg'); }
        .cit2 { background-image: url('cit2.jpg'); }
        .cit3 { background-image: url('cit3.jpg'); }
        .cit4 { background-image: url('cit4.jpg'); }
        .cit5 { background-image: url('cit5.jpg'); }
        .cit6 { background-image: url('cit6.jpg'); }

        #display-text {
            font-size: 1.3rem;
            font-weight: 700;
            min-height: 3.5rem;
            margin-bottom: 25px;
            color: #d81b60;
        }

        .btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
        }

        .btn:hover { transform: scale(1.1); background: #ff1493; }

        .heart-btn {
            font-size: 80px;
            cursor: pointer;
            background: none;
            border: none;
            animation: beat 0.8s infinite alternate;
        }

        @keyframes beat { to { transform: scale(1.2); } }

        .final-screen {
            background: #000;
            color: white;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .hidden { display: none; }
        .invisible { visibility: hidden; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="image-frame" class="image-box cit1"></div>
    
    <div id="display-text"></div>
    
    <div id="btn-container">
        <button class="btn" id="action-btn" onclick="nextStep()">أبدأ ❤️</button>
    </div>
</div>

<div id="final-screen" class="final-screen hidden">
    <div style="width: 85%;">
        <div class="image-box cit6" style="border: 3px solid #ff69b4;"></div>
        <h2 style="color: #ff69b4; margin-top: 20px;">أغنيتنا المفضلة 🎵</h2>
        <p style="font-size: 1.4rem;">اعشقج واحبج يا روان قلبي ❤️</p>
        <p style="color: #ffb6c1;">- من أحمد -</p>
        <audio id="player" controls style="margin-top: 20px; width: 100%;">
            <source src="https://www.mboxdrive.com/ya-helm-wardi.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

<script>
    let currentStep = 0;
    const textElement = document.getElementById('display-text');
    const imageFrame = document.getElementById('image-frame');
    const btn = document.getElementById('action-btn');

    // البيانات: النص، والكلاس الخاص بالخلفية، واسم الزر
    const content = [
        { text: "هلو روان", class: "cit1", btn: "هلوو" },
        { text: "روان عندي سؤال الجججج", class: "cit2", btn: "شنو هو؟" },
        { text: "بس مستحية اسألك اياه 😂", class: "cit3", btn: "اسألي" },
        { text: "تحبين احمد لو لااا؟", class: "cit4", btn: "ها؟ 🤭" },
        { text: "شنو هااا 😒 تحبين احمد لو لااا؟", class: "cit5", btn: "مدري" },
        { text: "اذا تحبين احمد دوسي على القلب 🤭", class: "cit6", btn: "❤️" }
    ];

    function typeWriter(text, i, fnCallback) {
        if (i < text.length) {
            textElement.innerHTML = text.substring(0, i + 1);
            setTimeout(function() {
                typeWriter(text, i + 1, fnCallback)
            }, 100);
        } else if (typeof fnCallback == 'function') {
            fnCallback();
        }
    }

    function nextStep() {
        if (currentStep >= content.length) {
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            document.getElementById('player').play();
            return;
        }

        const data = content[currentStep];
        btn.classList.add('invisible');
        
        // تغيير كلاس الصورة ليتم جلب الخلفية من CSS
        imageFrame.className = "image-box " + data.class;
        
        textElement.innerHTML = ""; 
        
        typeWriter(data.text, 0, function() {
            btn.classList.remove('invisible');
            btn.innerText = data.btn;
            if(data.btn === "❤️") {
                btn.className = "heart-btn";
                btn.innerHTML = "❤️";
            }
        });

        currentStep++;
    }

    window.onload = nextStep;
</script>

</body>
</html>
