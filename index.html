<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى روان ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* لون وردي فاتح جداً وناعم */
            background-color: #ffeef2;
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: #d81b60;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 40px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 15px 40px rgba(255, 182, 193, 0.4);
            border: 2px solid #ffc1cc;
        }

        .image-box {
            background: #fff0f5;
            padding: 15px;
            border-radius: 30px;
            margin-bottom: 20px;
            display: inline-block;
        }

        img {
            width: 160px;
            height: 160px;
            object-fit: contain;
        }

        /* تنسيق نص الكتابة */
        #display-text {
            font-size: 1.3rem;
            font-weight: 700;
            min-height: 3rem;
            margin-bottom: 25px;
            color: #d81b60;
        }

        .btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.1);
            background: #ff1493;
        }

        .heart-btn {
            font-size: 80px;
            cursor: pointer;
            background: none;
            border: none;
            display: block;
            margin: 0 auto;
            animation: beat 0.8s infinite alternate;
        }

        @keyframes beat { to { transform: scale(1.2); } }

        /* شاشة الموسيقى النهائية */
        .final-screen {
            background: #000;
            color: white;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .hidden { display: none; }
        .invisible { visibility: hidden; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="image-box">
        <img id="display-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHY5eXUxeGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v6aOebdclSPr2/giphy.gif">
    </div>
    <div id="display-text"></div>
    <div id="btn-container">
        <button class="btn" id="action-btn" onclick="nextStep()">أبدأ ❤️</button>
    </div>
</div>

<div id="final-screen" class="final-screen hidden">
    <div style="width: 85%;">
        <img src="https://i.pinimg.com/736x/8c/8b/6d/8c8b6d9d9f5a0e1c6e1a1a1a1a1a1a1a.jpg" style="width: 180px; border-radius: 20px; border: 3px solid #ff69b4;">
        <h2 style="color: #ff69b4; margin-top: 20px;">أغنيتنا المفضلة 🎵</h2>
        <p style="font-size: 1.4rem;">اعشقج واحبج يا روان قلبي ❤️</p>
        <p style="color: #ffb6c1;">- من أحمد -</p>
        <audio id="player" controls style="margin-top: 20px; width: 100%;">
            <source src="https://www.mboxdrive.com/ya-helm-wardi.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

<script>
    let currentStep = 0;
    const textElement = document.getElementById('display-text');
    const imgElement = document.getElementById('display-img');
    const btn = document.getElementById('action-btn');

    const content = [
        { text: "هلو روان", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHY5eXUxeGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v6aOebdclSPr2/giphy.gif", btn: "هلوو" },
        { text: "روان عندي سؤال الجججج", img: "https://media.giphy.com/media/Vp267zS3XG0E0/giphy.gif", btn: "شنو هو؟" },
        { text: "بس مستحية اسألك اياه 😂", img: "https://media.giphy.com/media/3o7TKuyfNhdVpZ8yNi/giphy.gif", btn: "اسألي" },
        { text: "تحبين احمد لو لااا؟", img: "https://media.giphy.com/media/c76IJLufpN95e/giphy.gif", btn: "ها؟ 🤭" },
        { text: "شنو هااا 😒 تحبين احمد لو لااا؟", img: "https://media.giphy.com/media/10tIjpzIu8feY8/giphy.gif", btn: "مدري" },
        { text: "اذا تحبين احمد دوسي على القلب 🤭", img: "https://media.giphy.com/media/9d66YmZ4U7KSc/giphy.gif", btn: "❤️" }
    ];

    function typeWriter(text, i, fnCallback) {
        if (i < text.length) {
            textElement.innerHTML = text.substring(0, i + 1);
            setTimeout(function() {
                typeWriter(text, i + 1, fnCallback)
            }, 100);
        } else if (typeof fnCallback == 'function') {
            fnCallback();
        }
    }

    function nextStep() {
        if (currentStep >= content.length) {
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            document.getElementById('player').play();
            return;
        }

        const data = content[currentStep];
        btn.classList.add('invisible');
        imgElement.src = data.img;
        textElement.innerHTML = ""; // مسح النص قبل البدء
        
        typeWriter(data.text, 0, function() {
            btn.classList.remove('invisible');
            btn.innerText = data.btn;
            if(data.btn === "❤️") {
                btn.className = "heart-btn";
                btn.innerHTML = "❤️";
            }
        });

        currentStep++;
    }

    window.onload = nextStep;
</script>

</body>
</html>
