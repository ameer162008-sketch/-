<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى روان ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* نفس ألوان الفيديو وردي غامق */
            background: radial-gradient(circle, #ff4081 0%, #880e4f 100%);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .image-box {
            background: white;
            padding: 15px;
            border-radius: 25px;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        img {
            width: 170px;
            height: 170px;
            object-fit: contain;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .btn {
            background: #ffffff;
            color: #d81b60;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: scale(1.1);
            background: #fce4ec;
        }

        .heart-btn {
            font-size: 90px;
            cursor: pointer;
            background: none;
            border: none;
            display: block;
            margin: 0 auto;
            animation: beat 0.7s infinite alternate;
            filter: drop-shadow(0 0 15px #ff1744);
        }

        @keyframes beat {
            to { transform: scale(1.25); }
        }

        /* الشاشة النهائية السوداء */
        .final-screen {
            background: black;
            color: white;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .music-card {
            width: 80%;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="image-box">
        <img id="display-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHY5eXUxeGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v6aOebdclSPr2/giphy.gif" alt="Hello Kitty">
    </div>
    <h2 id="display-text">هلو روان</h2>
    <div id="btn-container">
        <button class="btn" onclick="handleStep()">هلوو</button>
    </div>
</div>

<div id="final-screen" class="final-screen hidden">
    <div class="music-card">
        <img src="https://i.pinimg.com/736x/8c/8b/6d/8c8b6d9d9f5a0e1c6e1a1a1a1a1a1a1a.jpg" style="width: 200px; border-radius: 20px;">
        <h3 style="color: #ff69b4; margin-top: 20px;">أغنيتنا المفضلة 🎵</h3>
        <p style="font-size: 1.2rem;">اعشقج واحبج يا روان قلبي ❤️</p>
        <p style="color: #888;">- من أحمد -</p>
        <audio id="player" controls style="margin-top: 20px; width: 100%;">
            <source src="https://www.mboxdrive.com/ya-helm-wardi.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

<script>
    let step = 1;
    const imgElement = document.getElementById('display-img');
    const textElement = document.getElementById('display-text');
    const btnContainer = document.getElementById('btn-container');

    // صور تعبيرية لهيلو كيتي تناسب الحوار
    const kittyImages = [
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHY5eXUxeGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4eGZ4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v6aOebdclSPr2/giphy.gif",
        "https://media.giphy.com/media/Vp267zS3XG0E0/giphy.gif",
        "https://media.giphy.com/media/3o7TKuyfNhdVpZ8yNi/giphy.gif",
        "https://media.giphy.com/media/c76IJLufpN95e/giphy.gif",
        "https://media.giphy.com/media/10tIjpzIu8feY8/giphy.gif",
        "https://media.giphy.com/media/9d66YmZ4U7KSc/giphy.gif"
    ];

    function handleStep() {
        step++;
        
        if (step === 2) {
            imgElement.src = kittyImages[1];
            textElement.innerText = "روان عندي سؤال الجججج";
            btnContainer.innerHTML = `<button class="btn" onclick="handleStep()">شنو هو؟</button>`;
        } 
        else if (step === 3) {
            imgElement.src = kittyImages[2];
            textElement.innerText = "بس مستحية اسألك اياه 😂";
            btnContainer.innerHTML = `<button class="btn" onclick="handleStep()">اسأليي</button>`;
        }
        else if (step === 4) {
            imgElement.src = kittyImages[3];
            textElement.innerText = "تحبين احمد لو لااا؟";
            btnContainer.innerHTML = `<button class="btn" onclick="handleStep()">ها؟ 🤭</button>`;
        }
        else if (step === 5) {
            imgElement.src = kittyImages[4];
            textElement.innerText = "شنو هااا 😒 تحبين احمد لو لااا؟";
            btnContainer.innerHTML = `<button class="btn" onclick="handleStep()">مدري</button>`;
        }
        else if (step === 6) {
            imgElement.src = kittyImages[5];
            textElement.innerText = "اذا تحبين احمد دوسي على القلب 🤭";
            btnContainer.innerHTML = `<button class="heart-btn" onclick="handleStep()">❤️</button>`;
        }
        else if (step === 7) {
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            document.body.style.background = "black";
            const audio = document.getElementById('player');
            audio.play().catch(e => console.log("التشغيل التلقائي يحتاج تفاعل"));
        }
    }
</script>

</body>
</html>
