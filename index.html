<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى روان ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d81b60;
            --bg-color: #ffeef2;
            --soft-pink: #ffc1cc;
            --transition-speed: 0.4s;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: var(--primary-color);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 20px;
            border-radius: 40px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.5);
            border: 2px solid var(--soft-pink);
            transform: translateY(0);
            transition: transform var(--transition-speed) ease;
        }

        /* حاوية الصورة مع دعم FPS عالي للانتقالات */
        .image-box {
            width: 180px;
            height: 180px;
            border-radius: 30px;
            margin: 0 auto 25px auto;
            background-size: cover;
            background-position: center;
            border: 6px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: background-image 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: background-image; /* لتحفيز كرت الشاشة */
        }

        /* كلاسات الصور المستدعاة من GitHub */
        .cit1 { background-image: url('cit1.jpg'); }
        .cit2 { background-image: url('cit2.jpg'); }
        .cit3 { background-image: url('cit3.jpg'); }
        .cit4 { background-image: url('cit4.jpg'); }
        .cit5 { background-image: url('cit5.jpg'); }
        .cit6 { background-image: url('cit6.jpg'); }

        #display-text {
            font-size: 1.4rem;
            font-weight: 700;
            height: 3.5rem; /* حجز مساحة ثابتة لمنع القفز */
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 1;
            transform: scale(1);
        }

        .btn:hover {
            transform: scale(1.08);
            background: #ff1493;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.4);
        }

        .btn:active { transform: scale(0.95); }

        .btn.hidden-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        .heart-btn {
            font-size: 85px;
            cursor: pointer;
            background: none;
            border: none;
            display: inline-block;
            animation: heartBeat 0.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .final-screen {
            background: #000;
            color: white;
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="image-frame" class="image-box cit1"></div>
    <div id="display-text"></div>
    <div id="btn-container">
        <button class="btn" id="action-btn" onclick="nextStep()">أبدأ ❤️</button>
    </div>
</div>

<div id="final-screen" class="final-screen hidden">
    <div style="width: 85%; text-align: center;">
        <div class="image-box cit6" style="border-color: #ff69b4; width: 200px; height: 200px;"></div>
        <h2 style="color: #ff69b4; font-size: 1.8rem;">أغنيتنا المفضلة 🎵</h2>
        <p style="font-size: 1.3rem; margin: 15px 0;">اعشقج واحبج يا روان قلبي ❤️</p>
        <p style="color: #ffb6c1; font-size: 0.9rem;">- من أحمد -</p>
        <audio id="player" controls style="margin-top: 25px; width: 100%; border-radius: 10px;">
            <source src="https://www.mboxdrive.com/ya-helm-wardi.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

<script>
    let currentStep = 0;
    const textElement = document.getElementById('display-text');
    const imageFrame = document.getElementById('image-frame');
    const btn = document.getElementById('action-btn');

    const content = [
        { text: "هلو روان", class: "cit1", btn: "هلوو" },
        { text: "روان عندي سؤال الجججج", class: "cit2", btn: "شنو هو؟" },
        { text: "بس مستحية اسألك اياه 😂", class: "cit3", btn: "اسألي" },
        { text: "تحبين احمد لو لااا؟", class: "cit4", btn: "ها؟ 🤭" },
        { text: "شنو هااا 😒 تحبين احمد لو لااا؟", class: "cit5", btn: "مدري" },
        { text: "اذا تحبين احمد دوسي على القلب 🤭", class: "cit6", btn: "❤️" }
    ];

    // دالة الكتابة باستخدام منطق أكثر سلاسة ونظافة
    function typeEffect(text, callback) {
        let i = 0;
        textElement.innerHTML = "";
        
        function type() {
            if (i < text.length) {
                textElement.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 60); // سرعة كتابة متوازنة ومنظمة
            } else {
                if (callback) callback();
            }
        }
        type();
    }

    function nextStep() {
        if (currentStep >= content.length) {
            document.getElementById('main-container').style.transform = "scale(0.8)";
            setTimeout(() => {
                document.getElementById('main-container').classList.add('hidden');
                document.getElementById('final-screen').classList.remove('hidden');
                document.getElementById('player').play().catch(() => {});
            }, 300);
            return;
        }

        const data = content[currentStep];
        
        // تأثيرات بصرية منظمة عند الانتقال
        btn.classList.add('hidden-btn');
        imageFrame.style.opacity = "0.7";
        
        setTimeout(() => {
            imageFrame.className = "image-box " + data.class;
            imageFrame.style.opacity = "1";
            
            typeEffect(data.text, () => {
                btn.classList.remove('hidden-btn');
                btn.innerText = data.btn;
                
                // تحويل الزر لقلب في الخطوة الأخيرة بشكل سلس
                if(data.btn === "❤️") {
                    btn.className = "heart-btn";
                    btn.innerHTML = "❤️";
                }
            });
        }, 300);

        currentStep++;
    }

    // بدء التجربة عند تحميل الصفحة تماماً لضمان الـ FPS
    window.addEventListener('load', () => {
        setTimeout(nextStep, 500);
    });
</script>

</body>
</html>
